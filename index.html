<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="./public/hmd-logo.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#401b58" />
    <meta name="description" content="HMD Ultimate is an inclusive LGBTQ+ Ultimate Frisbee community in New York City welcoming players of all skill levels. Join our games, events, and inclusive community!" />
    
    <!-- Optimize external connections -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="dns-prefetch" href="//www.google.com" />
    <link rel="dns-prefetch" href="//www.instagram.com" />
    <link rel="preload" href="/hmd-logo.webp" as="image" type="image/webp" fetchpriority="high" />
    
    <!-- Preload and optimize Bootstrap CSS loading -->
    <link rel="preload" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
    <noscript><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" /></noscript>
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://hmdultimate.com/" />
    <meta property="og:title" content="HMD Ultimate - NYC LGBTQ+ Ultimate Frisbee" />
    <meta property="og:description" content="Join NYC's inclusive LGBTQ+ Ultimate Frisbee community for weekly games, social events, and more." />
    <meta property="og:image" content="https://hmdultimate.com/hmd-logo.webp" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://hmdultimate.com/" />
    <meta property="twitter:title" content="HMD Ultimate - NYC LGBTQ+ Ultimate Frisbee" />
    <meta property="twitter:description" content="Join NYC's inclusive LGBTQ+ Ultimate Frisbee community for weekly games, social events, and more." />
    <meta property="twitter:image" content="https://hmdultimate.com/hmd-logo.webp" />
    
    <title>HMD Ultimate - NYC LGBTQ+ Ultimate Frisbee</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    
    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(registration => {
              console.log('SW registered: ', registration);
            })
            .catch(registrationError => {
              console.log('SW registration failed: ', registrationError);
            });
        });
      }
    </script>
  </body>
</html>
